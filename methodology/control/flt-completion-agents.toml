[settings]
workspace_root = "."
default_timeout_secs = 3600
default_max_review_cycles = 2
codex_bin = "/Volumes/second-store/devel/knowledge-base-mcp/external/codex/codex-rs/target/release/codex"

[agents.sonnet5-designer]
name = "sonnet5-designer"
description = "Independent source-faithful FLT component designer"
backend = "claude-code"
role = "specialist"
model = "claude-sonnet-5"
permission_mode = "suggest"
output_format = "text"
timeout_secs = 1800
append_system_prompt = """
Act as an independent mathematical and Lean design reviewer. Read the repository but do not edit it.
Produce an implementable, dependency-ordered design with exact Lean signatures, source boundaries,
counterexample checks, and a stop-loss verdict. Never upgrade a scaffold or citation into a proof.
"""

[agents.fable5-designer-reviewer]
name = "fable5-designer-reviewer"
description = "Serialized Fable design and source-faithfulness review lane"
backend = "claude-code"
role = "reviewer"
model = "claude-fable-5"
permission_mode = "suggest"
output_format = "text"
timeout_secs = 1800
append_system_prompt = """
Act as a hostile mathematical and Lean reviewer. For design turns, produce an independent design.
For review turns, require a clean worktree frozen at the stated commit and record the producer model,
HEAD, tracked status, exact commands, exit codes, raw-log paths and hashes before judging the GPT
candidate against primary sources, actual Lean types, counterexamples, dependency closure, and the
target-stage axiom policy. Re-run the controller-approved targeted build, required umbrella build,
and exact declaration axiom audits. Do not modify tracked files or rely on producer summaries.
"""

# Producer-separated Fable review profiles for new GPT-5.6 FLT work. These are distinct from the
# historical Fable design profiles below so the controller cannot ambiguously mix design and review.

[agents.fable5-independent-reviewer-d6]
name = "fable5-independent-reviewer-d6"
description = "Difficulty-6/7 independent mathematical and Lean reviewer for GPT-produced work"
backend = "claude-code"
role = "reviewer"
model = "claude-fable-5"
permission_mode = "suggest"
output_format = "text"
timeout_secs = 1500
append_system_prompt = """
Review only a controller-frozen GPT-produced candidate from a clean worktree. Record producer and
reviewer identities, HEAD, tracked status, exact controller-approved commands, exit codes, raw-log
paths and hashes. Re-run targeted and umbrella builds plus exact declaration axiom audits. Inspect
primary sources, statements, counterexamples, dependencies, consumers, and control status. Do not
modify tracked files or rely on producer summaries. Return PASS, REVISE, UNCERTAIN, or REFUTED.
"""

